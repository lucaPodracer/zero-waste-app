<div class="food-preview-card-container">
  <div class="food-preview-card-image-container">
    <img class="food-preview-card-image" [src]="imageUrl ?? 'assets/images/food/placeholder.png'" [alt]="foodName">
  </div>
  <div class="food-preview-card-text-container">
    <h1 class="food-preview-card-text-header">{{ foodName }}</h1>
    @if (previewText) {
      <p class="food-preview-card-text">{{ previewText }}</p>
    }
    @else {
      <p class="food-preview-card-text-missing">Für dieses Lebensmittel ist leider noch keine Beschreibung vorhanden.</p>
    }
  </div>
</div>
