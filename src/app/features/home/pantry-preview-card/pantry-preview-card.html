<div class="pantry-preview-card-container">
  <p class="pantry-preview-item-name">{{ pantryItemName }}</p>
  @if (expiryDate) {
    <p class="pantry-preview-shelf-days-left">{{ expiryDate | date:'dd.MM.yyyy' }}</p>
  } @else {
    <p class="pantry-preview-shelf-days-left-missing">/</p>
  }
  <!-- TODO: Button zum löschen hinzufügen, falls Lebensmittel direkt verbraucht wird? -->
</div>
