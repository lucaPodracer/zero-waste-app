<mat-toolbar class="toolbar">

    <button mat-raised-button color="primary" (click)="openAddDialog()">
        <mat-icon>add</mat-icon>
        Lebensmittel
    </button>

    <span class="spacer"></span>

    <button mat-icon-button (click)="viewMode = 'grid'" [class.active]="viewMode === 'grid'">
        <mat-icon>grid_view</mat-icon>
    </button>

    <button mat-icon-button (click)="viewMode = 'list'" [class.active]="viewMode === 'list'">
        <mat-icon>view_list</mat-icon>
    </button>

</mat-toolbar>


@if(viewMode === 'grid') {

<div class="pantry-grid">

    @for(item of sortedPantryItems; track item.id) {
    <app-pantry-card [item]="item"></app-pantry-card>
    }

</div>

}


@if(viewMode === 'list') {

<app-pantry-list [items]="pantryItems()"></app-pantry-list>

}
